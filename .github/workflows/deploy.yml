# Deployment workflow for Hostinger
name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Enable manually triggering the workflow from the GitHub Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NODE_OPTIONS: "--max-old-space-size=4096"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Copy Server & Config files to dist
        run: |
          cp index.js dist/ || true
          cp package.json dist/ || true
          cp -r server-dist dist/ || true
          cp .htaccess dist/ || true

      - name: Clean FTP Server Hostname
        id: clean_ftp
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          # Trim leading/trailing whitespace and remove carriage returns
          CLEANED_SERVER=$(echo "$RAW_SERVER" | xargs | sed -E 's|\r||g')
          # Strip ftp:// or ftps:// prefix if present
          CLEANED_SERVER=$(echo "$CLEANED_SERVER" | sed -E 's|^ftps?://||')
          # Strip any trailing path or slash (e.g. ftp.example.com/subfolder -> ftp.example.com)
          CLEANED_SERVER=$(echo "$CLEANED_SERVER" | cut -d'/' -f1)
          # Strip port suffix if present (e.g. ftp.example.com:21 -> ftp.example.com)
          CLEANED_SERVER=$(echo "$CLEANED_SERVER" | cut -d':' -f1)

          echo "Cleaned server string: '$CLEANED_SERVER'"
          echo "server=$CLEANED_SERVER" >> $GITHUB_OUTPUT

      - name: 📂 Sync files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.clean_ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          log-level: verbose
          timeout: 120000
          security: loose
